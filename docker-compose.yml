services:
    dumbload:
        # Build locally (image is not published to a registry)
        build: .
        container_name: dumbload
        restart: unless-stopped
        ports:
            # Externally reachable on port 3800 -> internal app port 3000
            - "3800:3000"
        volumes:
            # Appdata: persistent app config (passkeys etc.) - classic Unraid appdata folder
            - ${APP_DATA_PATH:-/mnt/user/appdata/dumbload}:/app/config
            # Uploaded/download files - folder inside appdata
            - ${FILES_PATH:-/mnt/user/appdata/dumbload-files}:/app/uploads
        env_file:
            - .env
        environment:
            # Container-internal paths (must match the volume mounts above).
            # These stay in compose because they are container-specific paths, not user settings.
            UPLOAD_DIR: /app/uploads
            DUMBLOAD_CONFIG_DIR: /app/config

    # Optional malware scanner (clamd). Enable with:
    #   CLAMAV_SCAN_ENABLED=all|guest
    #   CLAMAV_HOST=clamav
    #   CLAMAV_PORT=3310
    clamav:
        image: clamav/clamav:stable
        container_name: dumbload-clamav
        restart: unless-stopped
        volumes:
            # Persistent virus definitions (freshclam downloads)
            - ${APP_DATA_PATH:-/mnt/user/appdata/dumbload}/clamav:/var/lib/clamav
