services:
    dumbload:
        # Build locally (image is not published to a registry)
        build: .
        container_name: dumbload
        restart: unless-stopped
        ports:
            # Externally reachable on port 3800 -> internal app port 3000
            - "3800:3000"
        volumes:
            # Replace "./local_uploads" (before the colon) with the path where files land on the host
            - ./local_uploads:/app/uploads
        env_file:
            - .env
        environment:
            # Container-internal upload path (must match the volume mount above).
            # This stays in compose because it is a container-specific path, not a user setting.
            UPLOAD_DIR: /app/uploads
