    <script defer>
        const CHUNK_SIZE = 1024 * 1024; // 1MB chunks
        const RETRY_DELAY = 1000; // 1 second delay between retries

        // Read MAX_RETRIES from the injected server value, with a fallback
        const MAX_RETRIES_STR = '{{MAX_RETRIES}}';
        let maxRetries = 5; // Default value
        if (MAX_RETRIES_STR && MAX_RETRIES_STR !== '{{MAX_RETRIES}}') {
            const parsedRetries = parseInt(MAX_RETRIES_STR, 10);
            if (!isNaN(parsedRetries) && parsedRetries >= 0) {
                maxRetries = parsedRetries;
            } else {
                console.warn(`Invalid MAX_RETRIES value "${MAX_RETRIES_STR}" received from server, defaulting to ${maxRetries}.`);
            }
        } else {
             console.warn('MAX_RETRIES not injected by server, defaulting to 5.');
        }
        window.MAX_RETRIES = maxRetries; // Assign to window for potential global use/debugging
        console.log(`Max retries for chunk uploads: ${window.MAX_RETRIES}`);

        const AUTO_UPLOAD_STR = '{{AUTO_UPLOAD}}';
        const AUTO_UPLOAD = ['true', '1', 'yes'].includes(AUTO_UPLOAD_STR.toLowerCase());

        const SHOW_FILE_LIST_STR = '{{SHOW_FILE_LIST}}';
        const SHOW_FILE_LIST = ['true', '1', 'yes'].includes(SHOW_FILE_LIST_STR.toLowerCase());

        // Upload validation config (injected from server)
        const MAX_FILE_SIZE_BYTES = parseInt('{{MAX_FILE_SIZE_MB}}', 10) * 1024 * 1024;
        const ALLOWED_EXTENSIONS = '{{ALLOWED_EXTENSIONS}}' ? '{{ALLOWED_EXTENSIONS}}'.split(',').map(e => e.trim().toLowerCase()).filter(e => e) : null;

        // Utility function to generate a unique batch ID
        function generateBatchId() {
            return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        }

        // Utility function to format file sizes
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Security helper to escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        class FileUploader {
            constructor(file, batchId) {
                this.file = file;
                this.batchId = batchId;
                this.uploadId = null;
                this.position = 0;
                this.progressElement = null;
                this.chunkSize = 1024 * 1024; // 1MB chunks
                this.lastUploadedBytes = 0;
                this.lastUploadTime = null;
                this.uploadRate = 0;
                this.maxRetries = window.MAX_RETRIES; // Use configured retries
                this.retryDelay = RETRY_DELAY; // Use constant
            }

            async start() {
                try {
                    this.updateProgress(0); // Initial progress update
                    await this.initUpload();
                    if (this.file.size > 0) { // Only upload chunks if file is not empty
                        await this.uploadChunks();
                    } else {
                        console.log(`Skipping chunk upload for zero-byte file: ${this.file.name}`);
                        // Server handles zero-byte completion in /init
                        this.updateProgress(100); // Mark as complete on client too
                    }
                    return true;
                } catch (error) {
                    console.error('Upload failed:', error);
                    if (this.progressElement) {
                        let userMessage = error.message || 'Upload failed';
                        if (error.message.includes('413') || error.message.includes('File too large')) {
                            userMessage = 'Datei ist zu groß';
                        } else if (error.message.includes('400') || error.message.includes('not allowed')) {
                            userMessage = 'Dateityp nicht erlaubt';
                        } else if (error.message.includes('403')) {
                            userMessage = 'Zugriff verweigert';
                        } else if (error.message.includes('500')) {
                            userMessage = 'Serverfehler';
                        }
                        this.progressElement.infoSpan.textContent = `Fehler: ${userMessage}`;
                        this.progressElement.infoSpan.style.color = 'var(--danger-color)';
                    }
                    return false;
                }
            }

            async initUpload() {
                // Always use webkitRelativePath if available, otherwise fallback to name
                const uploadPath = this.file.webkitRelativePath || this.file.name;
                
                console.log('Initializing upload:', {
                    path: uploadPath,
                    size: this.file.size,
                    batchId: this.batchId
                });

                const headers = {
                    'Content-Type': 'application/json'
                };
                
                if (this.batchId) {
                    headers['X-Batch-ID'] = this.batchId;
                }

                // Remove leading slash from API path before concatenating
                const apiUrl = '/api/upload/init'.startsWith('/') ? '/api/upload/init'.substring(1) : '/api/upload/init';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        filename: uploadPath.replace(/\\/g, '/'), // Ensure forward slashes
                        fileSize: this.file.size
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.details || error.error || 'Upload initialization failed');
                }

                const data = await response.json();
                this.uploadId = data.uploadId;
            }

            async uploadChunks() {
                this.createProgressElement();
                let currentChunkStartPosition = this.position; // Track start position for retries

                while (this.position < this.file.size) {
                    const chunk = await this.readChunk(); // Reads based on current this.position
                    try {
                        // Attempt to upload the chunk with retry logic
                        // Pass the position *before* reading the chunk, as that's the start of the data being sent
                        await this.uploadChunkWithRetry(chunk, currentChunkStartPosition);
                        // If successful, update the start position for the *next* chunk read
                        // this.position is updated internally by readChunk, so currentChunkStartPosition reflects the next read point
                        currentChunkStartPosition = this.position;
                    } catch (error) {
                        // If uploadChunkWithRetry fails after all retries, propagate the error
                        console.error(`UploadChunks failed after retries for chunk starting at ${currentChunkStartPosition}. File: ${this.file.webkitRelativePath || this.file.name}`);
                        throw error; // Propagate up to the start() method's catch block
                    }
                }
            }

            async readChunk() {
                const start = this.position;
                const end = Math.min(this.position + this.chunkSize, this.file.size);
                const blob = this.file.slice(start, end);
                this.position = end;
                return await blob.arrayBuffer();
            }

            async uploadChunkWithRetry(chunk, chunkStartPosition) {
                const chunkApiUrlPath = `/api/upload/chunk/${this.uploadId}`;
                const chunkApiUrl = chunkApiUrlPath.startsWith('/') ? chunkApiUrlPath.substring(1) : chunkApiUrlPath;
                let lastError = null;

                for (let attempt = 0; attempt <= this.maxRetries; attempt++) {
                    try {
                        if (attempt > 0) {
                            console.warn(`Retrying chunk (start: ${chunkStartPosition}) upload for ${this.file.webkitRelativePath || this.file.name} (Attempt ${attempt}/${this.maxRetries})...`);
                            this.updateProgressElementInfo(`Retrying attempt ${attempt}...`, 'var(--warning-color)');
                        }

                        // Use AbortController for potential timeout or cancellation during fetch
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30-second timeout per attempt

                        const response = await fetch(chunkApiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/octet-stream',
                                'X-Batch-ID': this.batchId
                                // Consider adding 'Content-Range': `bytes ${chunkStartPosition}-${chunkStartPosition + chunk.byteLength - 1}/${this.file.size}`
                                // If the server supports handling potential duplicate chunks via Content-Range
                            },
                            body: chunk,
                            signal: controller.signal // Add abort signal
                        });

                        clearTimeout(timeoutId); // Clear timeout if fetch completes

                        if (response.ok) {
                            const data = await response.json();
                            if (attempt > 0) {
                                console.log(`Chunk upload successful on retry attempt ${attempt} for ${this.file.webkitRelativePath || this.file.name}`);
                            }
                            // Update progress based on server response
                            // this.position is updated by readChunk(), so progress reflects total uploaded
                            this.updateProgress(data.progress);
                            // Success! Exit the retry loop.
                            this.updateProgressElementInfo('uploading...'); // Reset info message
                            return;
                        } else {
                            // Server responded with an error status (4xx, 5xx)
                            let errorText = 'Unknown server error';
                            try {
                                errorText = await response.text();
                            } catch (textError) { /* ignore if reading text fails */ }

                            // --- Add Special 404 Handling ---
                            if (response.status === 404 && attempt > 0) {
                                console.warn(`Received 404 Not Found on retry attempt ${attempt} for ${this.file.webkitRelativePath || this.file.name}. Assuming upload completed previously.`);
                                this.updateProgress(100); // Mark as complete
                                return; // Exit retry loop successfully
                            }
                            // --- End Special 404 Handling ---

                            lastError = new Error(`Failed to upload chunk: ${response.status} ${response.statusText}. Server response: ${errorText}`);
                            console.error(`Chunk upload attempt ${attempt} failed: ${lastError.message}`);
                            this.updateProgressElementInfo(`Attempt ${attempt} failed: ${response.statusText}`, 'var(--danger-color)');
                        }
                    } catch (error) {
                        // Network error, fetch failed completely, or timeout
                        lastError = error;
                        if (error.name === 'AbortError') {
                             console.error(`Chunk upload attempt ${attempt} timed out after 30 seconds.`);
                             this.updateProgressElementInfo(`Attempt ${attempt} timed out`, 'var(--danger-color)');
                        } else {
                            console.error(`Chunk upload attempt ${attempt} failed with network error: ${error.message}`);
                             this.updateProgressElementInfo(`Attempt ${attempt} network error`, 'var(--danger-color)');
                        }
                    }

                    // If not the last attempt, wait before retrying
                    if (attempt < this.maxRetries) {
                        // Exponential backoff: 1s, 2s, 4s, ... but capped
                        const delay = Math.min(this.retryDelay * Math.pow(2, attempt), 30000); // Max 30s delay
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }

                // If we exit the loop, all retries have failed.
                // Position reset is tricky. If the server *did* receive a chunk but failed to respond OK,
                // simply resending might corrupt data unless the server handles it idempotently.
                // Failing the whole upload is often safer.
                // this.position = chunkStartPosition; // Re-enable if server can handle duplicate chunks safely
                console.error(`Chunk upload failed permanently after ${this.maxRetries} retries for ${this.file.webkitRelativePath || this.file.name}, chunk starting at ${chunkStartPosition}.`);
                this.updateProgressElementInfo(`Upload failed after ${this.maxRetries} retries`, 'var(--danger-color)');
                throw lastError || new Error(`Chunk upload failed after ${this.maxRetries} retries.`);
            }

            createProgressElement() {
                const container = document.createElement('div');
                container.className = 'progress-container';
                
                const label = document.createElement('div');
                label.className = 'progress-label';
                const fileName = this.file.webkitRelativePath || this.file.name;
                label.textContent = fileName;

                const progress = document.createElement('div');
                progress.className = 'progress';
                
                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                
                const status = document.createElement('div');
                status.className = 'progress-status';
                
                const info = document.createElement('div');
                info.className = 'progress-info';
                
                const details = document.createElement('div');
                details.className = 'progress-details';

                status.appendChild(info);
                status.appendChild(details);
                
                progress.appendChild(bar);
                container.appendChild(label);
                container.appendChild(progress);
                container.appendChild(status);
                
                document.getElementById('uploadProgress').appendChild(container);
                this.progressElement = { container, bar, infoSpan: info, detailsSpan: details };
                this.lastUploadTime = Date.now();
            }

            updateProgress(percent) {
                if (this.progressElement) {
                    this.progressElement.bar.style.width = `${percent}%`;
                    
                    // Calculate upload rate
                    const currentTime = Date.now();
                    const timeDiff = (currentTime - this.lastUploadTime) / 1000; // Convert to seconds
                    const bytesDiff = this.position - this.lastUploadedBytes;
                    
                    if (timeDiff > 0) {
                        this.uploadRate = bytesDiff / timeDiff; // bytes per second
                    }
                    
                    // Format upload rate
                    let rateText = '0.0 B/s';
                    if (this.uploadRate > 0) {
                        const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
                        let unitIndex = 0;
                        let rate = this.uploadRate;
                        
                        while (rate >= 1024 && unitIndex < units.length - 1) {
                            rate /= 1024;
                            unitIndex++;
                        }
                        
                        rateText = `${rate.toFixed(1)} ${units[unitIndex]}`;
                    }
                    
                    // Update progress info
                    const statusText = percent < 100 ? 'uploading...' : 'complete';
                    // Use the helper for info updates, only update if not showing a retry message
                    if (!this.progressElement.infoSpan.textContent.startsWith('Retry') && !this.progressElement.infoSpan.textContent.startsWith('Attempt')) {
                       this.updateProgressElementInfo(`${rateText} · ${statusText}`);
                    }
                     this.progressElement.detailsSpan.textContent = 
                        `${formatFileSize(this.position)} of ${formatFileSize(this.file.size)} (${percent.toFixed(1)}%)`;
                    
                    // Update tracking variables
                    this.lastUploadedBytes = this.position;
                    this.lastUploadTime = currentTime;

                    if (percent === 100) {
                        setTimeout(() => {
                            this.progressElement.container.remove();
                        }, 1000);
                    }
                }
            }

            // Helper to update the info message and color in the progress element
            updateProgressElementInfo(message, color = '') {
                 if (this.progressElement && this.progressElement.infoSpan) {
                    this.progressElement.infoSpan.textContent = message;
                    this.progressElement.infoSpan.style.color = color; // Reset if color is empty string
                }
            }

            // Helper to attempt cancellation on the server
            async cancelUploadOnServer() {
                if (!this.uploadId) return;
                console.log(`Attempting to cancel upload ${this.uploadId} on server due to error.`);
                try {
                     const cancelApiUrlPath = `/api/upload/cancel/${this.uploadId}`;
                     const cancelApiUrl = cancelApiUrlPath.startsWith('/') ? cancelApiUrlPath.substring(1) : cancelApiUrlPath;
                    // No need to wait for response here, just fire and forget
                    fetch(cancelApiUrl, { method: 'POST' }).catch(err => {
                         console.warn(`Sending cancel request failed for upload ${this.uploadId}:`, err);
                    });
                } catch (cancelError) {
                    // Catch synchronous errors, though unlikely with fetch
                    console.warn(`Error initiating cancel request for upload ${this.uploadId}:`, cancelError);
                } // Add closing brace for try block
            }
        }

        // UI Event Handlers
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const fileList = document.getElementById('fileList');
        const fileListSection = document.getElementById('fileListSection');
        const fileListTitle = document.getElementById('fileListTitle');
        const clearFilesBtn = document.getElementById('clearFilesBtn');
        const uploadButton = document.getElementById('uploadButton');
        let files = [];

        // Stable identity so the same file (name + size) is never added twice.
        // webkitRelativePath is used when available so equally-named files in
        // different folders are not wrongly treated as duplicates.
        function fileIdentity(file) {
            return `${file.webkitRelativePath || file.name}|${file.size}`;
        }

        // Append new files (deduplicated) and re-render the list
        function addFiles(newFiles) {
            const existing = new Set(files.map(fileIdentity));
            for (const f of newFiles) {
                const id = fileIdentity(f);
                if (existing.has(id)) continue;
                existing.add(id);
                files.push(f);
            }
            renderFileList();
            if (AUTO_UPLOAD && files.length > 0) startUploads();
        }

        function removeFile(index) {
            files.splice(index, 1);
            renderFileList();
        }

        function clearFiles() {
            files = [];
            fileInput.value = '';
            folderInput.value = '';
            renderFileList();
        }

        // Render the pending files as a scrollable list with a remove button per row
        function renderFileList() {
            fileList.innerHTML = '';
            const hasFiles = files.length > 0;
            fileListSection.style.display = hasFiles ? 'block' : 'none';
            if (!hasFiles) {
                uploadButton.style.display = 'none';
                return;
            }

            fileListTitle.textContent = `${files.length} file${files.length !== 1 ? 's' : ''} selected`;

            files.forEach((file, index) => {
                const row = document.createElement('div');
                row.className = 'file-row';

                const idx = document.createElement('div');
                idx.className = 'file-row-index';
                idx.textContent = index + 1;

                const info = document.createElement('div');
                info.className = 'file-row-info';

                const name = document.createElement('div');
                name.className = 'file-row-name';
                name.textContent = file.webkitRelativePath || file.name;
                name.title = file.webkitRelativePath || file.name;

                const size = document.createElement('div');
                size.className = 'file-row-size';
                size.textContent = formatFileSize(file.size);

                info.appendChild(name);
                info.appendChild(size);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'file-remove-btn';
                removeBtn.type = 'button';
                removeBtn.setAttribute('aria-label', 'Remove file');
                removeBtn.textContent = '\u2715';
                removeBtn.addEventListener('click', () => removeFile(index));

                row.appendChild(idx);
                row.appendChild(info);
                row.appendChild(removeBtn);
                fileList.appendChild(row);
            });

            if (AUTO_UPLOAD) {
                uploadButton.style.display = 'none';
            } else {
                uploadButton.textContent = `Upload ${files.length} file${files.length !== 1 ? 's' : ''}`;
                uploadButton.style.display = 'block';
            }
        }

        // For drag and drop folders
        async function getAllFileEntries(dataTransferItems) {
            const fileEntries = [];

            async function traverseFileEntry(entry, path = '') {
                const file = await new Promise((resolve) => {
                    entry.file(result => {
                        const fullPath = path ? `${path}/${entry.name}` : entry.name;
                        const fileWithPath = new File([result], entry.name, {
                            type: result.type,
                            lastModified: result.lastModified
                        });
                        Object.defineProperty(fileWithPath, 'webkitRelativePath', {
                            value: fullPath,
                            writable: false,
                            configurable: true
                        });
                        resolve(fileWithPath);
                    });
                });
                fileEntries.push(file);
            }

            async function traverseDirectoryEntry(entry, path = '') {
                const dirReader = entry.createReader();
                const dirPath = path ? `${path}/${entry.name}` : entry.name;

                while (true) {
                    const entries = await new Promise((resolve, reject) => {
                        dirReader.readEntries(resolve, reject);
                    });
                    if (entries.length === 0) break;
                    for (const childEntry of entries) {
                        if (childEntry.isFile) {
                            await traverseFileEntry(childEntry, dirPath);
                        } else if (childEntry.isDirectory) {
                            await traverseDirectoryEntry(childEntry, dirPath);
                        }
                    }
                }
            }

            for (const item of dataTransferItems) {
                try {
                    const entry = item.webkitGetAsEntry();
                    if (entry) {
                        if (entry.isFile) {
                            await traverseFileEntry(entry);
                        } else if (entry.isDirectory) {
                            await traverseDirectoryEntry(entry);
                        }
                    }
                } catch (error) {
                    console.error('Error processing drop item:', error);
                }
            }

            fileEntries.sort((a, b) => a.webkitRelativePath.localeCompare(b.webkitRelativePath));
            return fileEntries;
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);
        folderInput.addEventListener('change', handleFolders, false);
        uploadButton.addEventListener('click', startUploads);
        clearFilesBtn.addEventListener('click', clearFiles);
        dropZone.addEventListener('paste', handlePaste, false);

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function highlight(e) {
            dropZone.classList.add('highlight');
        }

        function unhighlight(e) {
            dropZone.classList.remove('highlight');
        }

        async function handleDrop(e) {
            const items = e.dataTransfer.items;
            if (items && items.length > 0 && typeof items[0].webkitGetAsEntry === 'function') {
                // Show loading state
                fileListSection.style.display = 'block';
                const loadingItem = document.createElement('div');
                loadingItem.className = 'file-row loading';
                loadingItem.textContent = 'Processing dropped items...';
                fileList.appendChild(loadingItem);

                try {
                    const newFiles = await getAllFileEntries(items);
                    loadingItem.remove();

                    if (newFiles.length === 0) {
                        console.warn('No valid files found in drop');
                        renderFileList();
                        return;
                    }

                    addFiles(newFiles);
                } catch (error) {
                    console.error('Error processing dropped items:', error);
                    loadingItem.textContent = `Error: ${error.message}`;
                    loadingItem.style.color = 'var(--danger-color)';
                    setTimeout(() => {
                        loadingItem.remove();
                        renderFileList();
                    }, 3000);
                }
            } else {
                // Handle regular files (not folders)
                addFiles([...e.dataTransfer.files]);
            }
        }

        function handlePaste(e) {
            e.preventDefault();
            e.stopPropagation();

            const clipboardItems = e.clipboardData.items;
            if (!clipboardItems || clipboardItems.length === 0) return;

            const pastedFiles = [];
            for (const clipboardItem of clipboardItems) {
                try {
                    if (clipboardItem.kind === 'file') {
                        const file = clipboardItem.getAsFile();
                        if (file) {
                            pastedFiles.push(file);
                        }
                    } else if (clipboardItem.kind === 'string' && clipboardItem.type.startsWith('text/')) {
                        const text = e.clipboardData.getData('text/plain');
                        if (text) {
                            const file = new File([text], 'pasted-text.txt', { type: 'text/plain' });
                            pastedFiles.push(file);
                        }
                    }
                } catch (err) {
                    console.error('Error processing pasted item:', err);
                }
            }

            if (pastedFiles.length > 0) {
                addFiles(pastedFiles);
            }
        }

        function handleFiles(e) {
            const input = e.target;
            addFiles([...input.files]);
            // Reset the input to allow selecting the same file again
            input.value = '';
        }

        function handleFolders(e) {
            const input = e.target;
            const selectedFiles = [...input.files];

            // Check for webkitRelativePath support
            const missingRelPath = selectedFiles.some(f => !('webkitRelativePath' in f) || !f.webkitRelativePath);
            if (missingRelPath) {
                alert('Your browser does not support folder uploads with structure. Please use a modern browser like Chrome or Edge.');
                input.value = '';
                return;
            }

            console.log('Folder selection files:', selectedFiles.map(f => ({
                name: f.name,
                path: f.webkitRelativePath,
                size: f.size
            })));

            addFiles(selectedFiles);
            input.value = '';
        }

        // Add this CSS to the existing styles
        const style = document.createElement('style');
        style.textContent = `

        /* Rename modal styles */

        document.head.appendChild(style);

        function validateFiles(fileList) {
            const errors = [];
            for (const file of fileList) {
                const fileName = file.webkitRelativePath || file.name;
                if (MAX_FILE_SIZE_BYTES && file.size > MAX_FILE_SIZE_BYTES) {
                    errors.push(`Datei "${fileName}" ist zu groß (${formatFileSize(file.size)} > Limit ${formatFileSize(MAX_FILE_SIZE_BYTES)})`);
                }
                if (ALLOWED_EXTENSIONS && ALLOWED_EXTENSIONS.length > 0) {
                    const ext = fileName.includes('.') ? '.' + fileName.split('.').pop().toLowerCase() : '';
                    if (ext && !ALLOWED_EXTENSIONS.includes(ext)) {
                        errors.push(`Dateityp "${ext}" nicht erlaubt. Erlaubt: ${ALLOWED_EXTENSIONS.join(', ')}`);
                    }
                }
            }
            return errors;
        }

        async function startUploads() {
            const validationErrors = validateFiles(files);
            if (validationErrors.length > 0) {
                const errorText = validationErrors.slice(0, 5).join('\n');
                const remaining = validationErrors.length - 5;
                const suffix = remaining > 0 ? `\n... und ${remaining} weitere Fehler` : '';
                Toastify({
                    text: `Validierungsfehler:\n${errorText}${suffix}`,
                    duration: 8000,
                    gravity: "bottom",
                    position: "right",
                    style: { background: "#f44336", whiteSpace: "pre-wrap", maxWidth: "400px" }
                }).showToast();
                return;
            }

            try {
                uploadButton.disabled = true;
                document.getElementById('uploadProgress').innerHTML = '';
                
                const batchId = generateBatchId();
                const results = [];
                
                // Process files sequentially within the same batch to prevent overwhelming the server
                for (const file of files) {
                    const uploader = new FileUploader(file, batchId);
                    const result = await uploader.start();
                    results.push(result);
                }
                
                const successful = results.filter(r => r).length;
                const total = results.length;
                
                Toastify({
                    text: `Uploaded ${successful} of ${total} files`,
                    duration: 3000,
                    gravity: "bottom",
                    position: "right",
                    style: {
                        background: successful === total ? "#4CAF50" : "#f44336"
                    }
                }).showToast();

                // Reset file inputs and pending list
                clearFiles();
                
                // Refresh the uploaded files list if it's enabled
                if (SHOW_FILE_LIST && fileListManager) {
                    fileListManager.loadFiles();
                }
            } catch (error) {
                console.error('Upload failed:', error);
                let errorMessage = 'Upload fehlgeschlagen';
                if (error.message.includes('413') || error.message.includes('File too large')) {
                    errorMessage = 'Datei ist zu groß für den Server. Bitte Kontaktieren Sie den Administrator.';
                } else if (error.message.includes('400') || error.message.includes('not allowed')) {
                    errorMessage = 'Dateityp nicht erlaubt: ' + error.message;
                } else if (error.message.includes('401') || error.message.includes('Unauthorized')) {
                    errorMessage = 'Nicht autorisiert. Bitte Seite neu laden und erneut anmelden.';
                } else if (error.message.includes('403')) {
                    errorMessage = 'Zugriff verweigert: ' + error.message;
                } else if (error.message.includes('500')) {
                    errorMessage = 'Serverfehler. Bitte versuchen Sie es später erneut.';
                }
                Toastify({
                    text: errorMessage,
                    duration: 5000,
                    gravity: "bottom",
                    position: "right",
                    style: {
                        background: "#f44336"
                    }
                }).showToast();
            } finally {
                uploadButton.disabled = false;
            }
        }

        // File listing functionality
        class FileListManager {
            constructor() {
                this.uploadedFilesList = document.getElementById('uploadedFilesList');
                this.uploadedFilesContent = document.getElementById('uploadedFilesContent');
                this.totalFilesSpan = document.getElementById('totalFiles');
                this.totalSizeSpan = document.getElementById('totalSize');
                this.refreshBtn = document.getElementById('refreshFilesBtn');
                this.renameModal = document.getElementById('renameModal');
                this.renameInput = document.getElementById('renameInput');
                this.currentRenameData = null;
                
                if (SHOW_FILE_LIST) {
                    this.init();
                }
            }
            
            init() {
                this.uploadedFilesList.style.display = 'block';
                this.refreshBtn.addEventListener('click', () => this.loadFiles());
                this.setupModalEventListeners();
                this.loadFiles();
            }
            
            setupModalEventListeners() {
                // Ensure modal closes when clicking outside
                this.renameModal.addEventListener('click', (e) => {
                    if (e.target === this.renameModal) {
                        this.cancelRename();
                    }
                });
                
                // Handle keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (this.renameModal.classList.contains('show')) {
                        if (e.key === 'Escape') {
                            this.cancelRename();
                        }
                    }
                });
            }
            
            async loadFiles() {
                try {
                    this.showLoading();
                    const response = await fetch('/api/files');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    this.displayFiles(data);
                } catch (error) {
                    console.error('Failed to load files:', error);
                    this.showError('Failed to load files: ' + error.message);
                }
            }
            
            showLoading() {
                this.uploadedFilesContent.innerHTML = '<div class="loading-message">Loading files...</div>';
            }
            
            showError(message) {
                this.uploadedFilesContent.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
            }
            
            displayFiles(data) {
                this.totalFilesSpan.textContent = `${data.totalFiles} file${data.totalFiles !== 1 ? 's' : ''}`;
                this.totalSizeSpan.textContent = data.formattedTotalSize || formatFileSize(data.totalSize);
                
                if (data.items.length === 0) {
                    this.uploadedFilesContent.innerHTML = '<div class="empty-message">No files uploaded yet</div>';
                    return;
                }
                
                this.uploadedFilesContent.innerHTML = '';
                this.renderItems(data.items, this.uploadedFilesContent);
            }
            
            renderItems(items, container, level = 0) {
                items.forEach(item => {
                    const itemElement = this.createItemElement(item, level);
                    container.appendChild(itemElement);
                    
                    if (item.type === 'directory' && item.children && item.children.length > 0) {
                        const childrenContainer = document.createElement('div');
                        childrenContainer.className = 'directory-children';
                        this.renderItems(item.children, childrenContainer, level + 1);
                        container.appendChild(childrenContainer);
                    }
                });
            }
            
            createItemElement(item, level) {
                const itemDiv = document.createElement('div');
                itemDiv.className = `uploaded-file-item ${item.type === 'directory' ? 'directory-item' : ''}`;
                
                const icon = item.type === 'directory' ? '📁' : '📄';
                const name = item.name;
                const details = item.type === 'directory' 
                    ? `${item.formattedSize} • ${this.countFilesInDirectory(item)} files`
                    : `${item.formattedSize} • ${new Date(item.uploadDate).toLocaleDateString()}`;
                
                // Create info section
                const infoDiv = document.createElement('div');
                infoDiv.className = 'uploaded-file-info';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'uploaded-file-name';
                nameDiv.textContent = `${icon} ${name}`;
                
                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'uploaded-file-details';
                detailsDiv.textContent = details;
                
                infoDiv.appendChild(nameDiv);
                infoDiv.appendChild(detailsDiv);
                
                // Create actions section
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'uploaded-file-actions';
                
                // Download button (only for files)
                if (item.type === 'file') {
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'action-btn download-btn';
                    downloadBtn.textContent = 'Download';
                    downloadBtn.dataset.path = item.path;
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.downloadFile(downloadBtn.dataset.path);
                    });
                    actionsDiv.appendChild(downloadBtn);
                }
                
                // Rename button
                const renameBtn = document.createElement('button');
                renameBtn.className = 'action-btn rename-btn';
                renameBtn.textContent = 'Rename';
                renameBtn.dataset.path = item.path;
                renameBtn.dataset.type = item.type;
                renameBtn.dataset.name = item.name;
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.renameItem(renameBtn.dataset.path, renameBtn.dataset.type, renameBtn.dataset.name);
                });
                actionsDiv.appendChild(renameBtn);
                
                // Delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.dataset.path = item.path;
                deleteBtn.dataset.type = item.type;
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.deleteItem(deleteBtn.dataset.path, deleteBtn.dataset.type);
                });
                actionsDiv.appendChild(deleteBtn);
                
                // Assemble the item
                itemDiv.appendChild(infoDiv);
                itemDiv.appendChild(actionsDiv);
                
                return itemDiv;
            }
            
            countFilesInDirectory(dir) {
                if (!dir.children) return 0;
                return dir.children.reduce((count, child) => {
                    return count + (child.type === 'file' ? 1 : this.countFilesInDirectory(child));
                }, 0);
            }
            
            async downloadFile(filePath) {
                try {
                    // Encode each part of the path separately to handle subdirectories
                    const encodedPath = filePath.split('/').map(part => encodeURIComponent(part)).join('/');
                    const url = `/api/files/download/${encodedPath}`;
                    window.open(url, '_blank');
                } catch (error) {
                    console.error('Download failed:', error);
                    Toastify({
                        text: `Download failed: ${error.message}`,
                        duration: 3000,
                        gravity: "bottom",
                        position: "right",
                        style: { background: "#f44336" }
                    }).showToast();
                }
            }
            
            async deleteItem(itemPath, itemType) {
                const itemName = itemPath.split('/').pop();
                const confirmMessage = itemType === 'directory' 
                    ? `Are you sure you want to delete the folder "${itemName}" and all its contents?`
                    : `Are you sure you want to delete the file "${itemName}"?`;
                
                if (!confirm(confirmMessage)) {
                    return;
                }
                
                try {
                    // Encode each part of the path separately to handle subdirectories
                    const encodedPath = itemPath.split('/').map(part => encodeURIComponent(part)).join('/');
                    const response = await fetch(`/api/files/${encodedPath}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error || 'Delete failed');
                    }
                    
                    Toastify({
                        text: `${itemType === 'directory' ? 'Folder' : 'File'} deleted successfully`,
                        duration: 3000,
                        gravity: "bottom",
                        position: "right",
                        style: { background: "#4CAF50" }
                    }).showToast();
                    
                    // Reload the file list
                    this.loadFiles();
                } catch (error) {
                    console.error('Delete failed:', error);
                    Toastify({
                        text: `Delete failed: ${error.message}`,
                        duration: 3000,
                        gravity: "bottom",
                        position: "right",
                        style: { background: "#f44336" }
                    }).showToast();
                }
            }
            
            async renameItem(itemPath, itemType, currentName) {
                this.currentRenameData = { itemPath, itemType, currentName };
                this.renameInput.value = currentName;
                this.renameModal.classList.add('show');
                this.renameInput.focus();
                this.renameInput.select();
                
                // Add Enter key support for this specific rename session
                const handleKeydown = (e) => {
                    if (e.key === 'Enter') {
                        this.confirmRename();
                    }
                };
                this.renameInput.addEventListener('keydown', handleKeydown);
                
                // Store the handler so we can remove it later
                this.currentKeydownHandler = handleKeydown;
            }
            
            cancelRename() {
                this.renameModal.classList.remove('show');
                this.currentRenameData = null;
                
                // Clean up event listener
                if (this.currentKeydownHandler) {
                    this.renameInput.removeEventListener('keydown', this.currentKeydownHandler);
                    this.currentKeydownHandler = null;
                }
            }
            
            async confirmRename() {
                if (!this.currentRenameData) return;
                
                const newName = this.renameInput.value.trim();
                if (!newName) {
                    alert('Please enter a valid name');
                    return;
                }
                
                if (newName === this.currentRenameData.currentName) {
                    this.cancelRename();
                    return;
                }
                
                try {
                    // Encode each part of the path separately to handle subdirectories
                    const encodedPath = this.currentRenameData.itemPath.split('/').map(part => encodeURIComponent(part)).join('/');
                    const response = await fetch(`/api/files/rename/${encodedPath}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ newName })
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error || 'Rename failed');
                    }
                    
                    const result = await response.json();
                    
                    Toastify({
                        text: result.message,
                        duration: 3000,
                        gravity: "bottom",
                        position: "right",
                        style: { background: "#4CAF50" }
                    }).showToast();
                    
                    // Close modal and reload file list
                    this.cancelRename();
                    this.loadFiles();
                    
                } catch (error) {
                    console.error('Rename failed:', error);
                    Toastify({
                        text: `Rename failed: ${error.message}`,
                        duration: 3000,
                        gravity: "bottom",
                        position: "right",
                        style: { background: "#f44336" }
                    }).showToast();
                }
            }
        }
        
        // Initialize file list manager
        const fileListManager = new FileListManager();

        // Theme management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Update icon
            const moonPaths = document.querySelectorAll('.moon');
            const sunPaths = document.querySelectorAll('.sun');
            
            if (theme === 'dark') {
                moonPaths.forEach(path => path.style.display = 'none');
                sunPaths.forEach(path => path.style.display = '');
            } else {
                moonPaths.forEach(path => path.style.display = '');
                sunPaths.forEach(path => path.style.display = 'none');
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);
    </script>
