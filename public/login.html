<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}} - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <script src="webauthn.js"></script>
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .pin-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .pin-header h1 {
            margin-bottom: 0.5rem;
        }

        .pin-header h2 {
            font-weight: 500;
            opacity: 0.9;
        }

        #pin-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            max-width: 100%;
            padding: 2rem 1rem;
        }

        .error-message {
            text-align: center;
            margin-top: 1rem;
            color: var(--danger-color);
            max-width: 300px;
            line-height: 1.4;
        }

        .pin-digit.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--danger-color);
            background-color: var(--textarea-bg);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-color);
            opacity: 0.5;
            font-size: 0.9rem;
            width: 100%;
            max-width: 300px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--border-color);
        }

        .passkey-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .passkey-btn:hover {
            background: var(--highlight-hover);
        }
        .passkey-btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* --- Animations --- */

        @keyframes pin-pop {
            0% { transform: scale(0.8); }
            60% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .pin-digit.filled {
            animation: pin-pop 0.16s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); }
            40%, 80% { transform: translateX(7px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes key-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.45); }
            50% { box-shadow: 0 0 0 9px rgba(33, 150, 243, 0); }
        }
        .passkey-btn {
            animation: key-glow 2.4s ease-in-out infinite;
        }
        .passkey-btn:hover,
        .passkey-btn:disabled {
            animation: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .passkey-spinner {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="pin-header">
            <h1>{{SITE_TITLE}}</h1>
            <h2 id="login-subtitle">Login</h2>
        </div>
        <div id="pin-section" style="display: none;">
            <form id="pin-form">
                <!-- PIN inputs will be dynamically added here -->
            </form>
        </div>
        <div id="passkey-section" style="display: none;">
            <div class="divider">or</div>
            <button id="passkey-btn" class="passkey-btn" type="button">
                <svg id="passkey-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span class="passkey-spinner" id="passkey-spinner" style="display:none"></span>
                <span id="passkey-label">Login with Passkey</span>
            </button>
        </div>
        <p id="pin-error" class="error-message"></p>
    </div>

    <script>
        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);

        let pinLength = 4;  // Default length, will be updated from server

        // Create PIN input boxes
        const createPinInputs = (length) => {
            const form = document.getElementById('pin-form');
            form.innerHTML = '';  // Clear existing inputs
            for (let i = 0; i < length; i++) {
                const input = document.createElement('input');
                input.type = 'password';
                input.className = 'pin-digit';
                input.maxLength = 1;
                input.pattern = '[0-9]';
                input.inputMode = 'numeric';
                input.autocomplete = 'off';
                input.required = true;
                form.appendChild(input);
            }
        };

        // Handle PIN input
        const handlePinInput = (e, index) => {
            const input = e.target;
            const form = document.getElementById('pin-form');
            const inputs = [...form.querySelectorAll('.pin-digit')];
            const value = input.value;

            // Only allow numbers
            if (!/^\d*$/.test(value)) {
                input.value = '';
                return;
            }

            if (value) {
                input.classList.add('filled');
                // Move to next input if available or submit if last
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else {
                    // Auto-submit when last digit is entered
                    const pin = inputs.map(input => input.value).join('');
                    if (pin.length === inputs.length) {
                        verifyPin(pin);
                    }
                }
            } else {
                input.classList.remove('filled');
            }
        };

        // Handle form submission
        const verifyPin = async (pin) => {
            try {
                const response = await fetch('/api/auth/verify-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin }),
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    document.getElementById('pin-error').textContent = data.error || 'Authentication failed';
                    
                    const isLockedOut = data.error && data.error.includes('Too many PIN verification attempts');
                    
                    const inputs = [...document.querySelectorAll('.pin-digit')];
                    if (isLockedOut) {
                        inputs.forEach(input => {
                            input.disabled = true;
                            input.classList.add('locked');
                        });
                    } else {
                        // Shake the form to signal a wrong PIN
                        const form = document.getElementById('pin-form');
                        form.classList.remove('shake');
                        void form.offsetWidth; // force reflow to restart animation
                        form.classList.add('shake');

                        inputs.forEach(input => {
                            input.value = '';
                            input.classList.remove('filled');
                        });
                        inputs[0].focus();
                    }
                }
            } catch (err) {
                console.error('Error verifying PIN:', err);
                document.getElementById('pin-error').textContent = 'Error verifying PIN';
            }
        };

        // Setup PIN handling
        const setupPinHandling = () => {
            const form = document.getElementById('pin-form');
            const inputs = [...form.querySelectorAll('.pin-digit')];

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => handlePinInput(e, index));
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                        inputs[index - 1].classList.remove('filled');
                    }
                });
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, inputs.length);
                    if (pastedData.length > 0) {
                        pastedData.split('').forEach((digit, i) => {
                            if (i < inputs.length) {
                                inputs[i].value = digit;
                                inputs[i].classList.add('filled');
                            }
                        });
                        if (pastedData.length === inputs.length) {
                            verifyPin(pastedData);
                        } else if (pastedData.length < inputs.length) {
                            inputs[pastedData.length].focus();
                        }
                    }
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const pin = inputs.map(input => input.value).join('');
                if (pin.length === inputs.length) {
                    verifyPin(pin);
                }
            });

            inputs[0].focus();
        };

        // Passkey login
        const loginWithPasskey = async () => {
            const errorEl = document.getElementById('pin-error');
            const btn = document.getElementById('passkey-btn');
            const spinner = document.getElementById('passkey-spinner');
            const icon = document.getElementById('passkey-icon');
            const label = document.getElementById('passkey-label');
            btn.disabled = true;
            errorEl.textContent = '';
            spinner.style.display = 'inline-block';
            icon.style.display = 'none';
            label.textContent = 'Checking...';

            try {
                // 1. Get authentication options
                const optionsResponse = await fetch('/api/passkey/auth-options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),
                    credentials: 'include'
                });
                const optionsData = await optionsResponse.json();
                if (!optionsData.challengeId) {
                    throw new Error('Failed to get authentication options');
                }

                // 2. Request credential from authenticator
                const credential = await navigator.credentials.get({
                    publicKey: toAuthOptions(optionsData.options)
                });

                // 3. Verify on server
                const verifyResponse = await fetch('/api/passkey/auth-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challengeId: optionsData.challengeId,
                        response: authToJSON(credential)
                    }),
                    credentials: 'include'
                });
                const verifyData = await verifyResponse.json();

                if (verifyData.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = verifyData.error || 'Passkey authentication failed';
                }
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    errorEl.textContent = 'Passkey authentication cancelled';
                } else {
                    console.error('Passkey login error:', err);
                    errorEl.textContent = 'Passkey authentication failed: ' + (err.message || err);
                }
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                icon.style.display = '';
                label.textContent = 'Login with Passkey';
            }
        };

        // Check auth status and initialize
        fetch('/api/auth/status')
            .then(response => {
                if (response.status === 429) {
                    throw new Error('Too many attempts. Please wait before trying again.');
                }
                return response.json();
            })
            .then(data => {
                // If no auth is required, redirect to main page
                if (!data.required) {
                    window.location.href = '/';
                    return;
                }

                const showPin = data.authMode === 'pin' || data.authMode === 'both';
                const showPasskey = (data.authMode === 'passkey' || data.authMode === 'both') && data.hasPasskeys;

                if (showPin && data.pinRequired) {
                    document.getElementById('pin-section').style.display = 'block';
                    document.getElementById('login-subtitle').textContent = 'Enter PIN';
                    pinLength = data.pinLength;
                    createPinInputs(pinLength);
                    setupPinHandling();
                }

                if (showPasskey) {
                    document.getElementById('passkey-section').style.display = 'block';
                    document.getElementById('passkey-btn').addEventListener('click', loginWithPasskey);
                    // Hide the "or" divider if only passkey is shown
                    if (!showPin || !data.pinRequired) {
                        document.querySelector('.divider').style.display = 'none';
                        document.getElementById('login-subtitle').textContent = 'Login with Passkey';
                    }
                }

                // Fallback: if neither PIN nor passkey is available but auth is required
                if ((!showPin || !data.pinRequired) && !showPasskey) {
                    document.getElementById('pin-error').textContent = 'No authentication method available. Please contact the administrator.';
                }
            })
            .catch(err => {
                console.error('Error checking auth status:', err);
                document.getElementById('pin-error').textContent = err.message || 'Error checking authentication status';
            });
    </script>
</body>
</html>
